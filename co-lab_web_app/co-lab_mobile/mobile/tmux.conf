# ╔══════════════════════════════════════════════════════════════╗
# ║  Co-LAB Mobile — tmux Configuration                        ║
# ║  Optimized for mobile (touch, small screen, proot)          ║
# ╚══════════════════════════════════════════════════════════════╝

# ── General Settings ──
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1

# ── Mouse Support (critical for touchscreen) ──
set -g mouse on

# Enable mouse scrolling (touch swipe → scroll)
bind -n WheelUpPane   if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# ── Prefix Key ──
# Default Ctrl+B works, but also add Ctrl+A as alternative
# (Ctrl+A is easier to hit on mobile keyboards)
set -g prefix C-b
set -g prefix2 C-a
bind C-a send-prefix

# ── Window Navigation ──
# Switch windows with Alt+number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

# Cycle windows with Alt+arrows
bind -n M-Left  previous-window
bind -n M-Right next-window

# ── Pane Navigation ──
# Switch panes with Ctrl+arrow (no prefix needed)
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# ── Pane Splitting ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Pane Resizing ──
# Hold prefix + arrow keys to resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Quick Pane Zoom (toggle fullscreen for current pane) ──
# Prefix + z (default) — super useful on small screens
# Double-tap Ctrl+A,z to zoom/unzoom current pane

# ── Status Bar ──
set -g status-position bottom
set -g status-style "bg=#1f2937,fg=#9ca3af"  # gray-800 bg, gray-400 text
set -g status-left-length 30
set -g status-right-length 60

# Left: session name
set -g status-left "#[fg=#f97316,bold] ◆ Co-LAB #[fg=#6b7280]│ "

# Right: pane count, time, memory
set -g status-right "#[fg=#6b7280]#(free -m 2>/dev/null | awk '/Mem:/ {printf \"%%dMB\", $7}' || echo '?')#[fg=#4b5563] │ #[fg=#9ca3af]%H:%M "

# Window tabs
setw -g window-status-format "#[fg=#6b7280] #I:#W "
setw -g window-status-current-format "#[fg=#f97316,bold] #I:#W "
setw -g window-status-separator ""

# ── Pane Borders ──
set -g pane-border-style "fg=#374151"        # gray-700
set -g pane-active-border-style "fg=#f97316"  # orange-500

# ── Message Styling ──
set -g message-style "bg=#f97316,fg=#111827,bold"

# ── Copy Mode (vi keys) ──
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Escape Time (reduce lag on mobile) ──
set -sg escape-time 10

# ── Rename Windows Automatically ──
setw -g automatic-rename on
set -g renumber-windows on

# ── Activity Monitoring ──
setw -g monitor-activity on
set -g visual-activity off  # Don't flash on activity (annoying on mobile)

# ── Session Persistence ──
# Quick save/restore with prefix + Ctrl+S / Ctrl+R
# (Requires tmux-resurrect plugin — install with TPM if desired)

# ── Reload Config ──
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
